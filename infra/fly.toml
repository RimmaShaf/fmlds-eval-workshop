# fly.toml app configuration file generated for fmlds-eval-workshop-gateway on 2026-11-18T14:03:57+08:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'fmlds-eval-workshop-gateway'
primary_region = 'nrt'

[build]
  context = ".."
  dockerfile = "Dockerfile"

[env]
  PORT = '8080'
  # OpenTelemetry v2 tracing -> the Phoenix board (central observability).
  # Every request through the gateway becomes a trace, tagged per seat key.
  LITELLM_OTEL_V2 = 'true'
  PHOENIX_COLLECTOR_HTTP_ENDPOINT = 'https://fmlds-eval-workshop-phoenix.fly.dev/v1/traces'
  PHOENIX_PROJECT_NAME = 'gateway'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  processes = ['app']

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health/liveliness"

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
