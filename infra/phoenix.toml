# fly.toml for the workshop Phoenix board (central observability).
#
# Receives traces from two directions:
#   1. server-side: the LiteLLM gateway's arize_phoenix callback (every request,
#      tagged per seat key) - see infra/litellm_config.yaml + gateway [env]
#   2. client-side: notebook 2's optional "publish to the board" cell
#      (participants' full CHAIN/TOOL span trees, project seat-<tag>)
#
# SQLite on a Fly volume is fine for a 1-day workshop (~30k spans). The
# version-* image tags run as root, which avoids volume permission issues.
# Client/server versions are pinned in lockstep: the notebook pip cell installs
# arize-phoenix==22.0.0. Full runbook: infra/DEPLOYMENT.md.

app = 'fmlds-eval-workshop-phoenix'
primary_region = 'nrt'

[build]
  image = 'arizephoenix/phoenix:version-22.0.0'

[env]
  PHOENIX_PORT = '6006'
  PHOENIX_WORKING_DIR = '/phoenix-data'

[[mounts]]
  source = 'phoenix_data'
  destination = '/phoenix-data'

[http_service]
  internal_port = 6006
  force_https = true
  auto_stop_machines = 'off'
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
